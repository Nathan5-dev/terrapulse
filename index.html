<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraPulse - Environmental Intelligence Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Données NASA réelles, générées par telecharger_donnees_nasa.py -->
    <script src="terrapulse_data.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        .tp-input { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 0.75rem;
                    padding: 0.5rem 0.75rem; font-size: 0.875rem; color: #e2e8f0; }
        .tp-input:focus { outline: none; border-color: #10b981; }
        .tp-label { display: block; font-size: 0.75rem; font-weight: 500; color: #cbd5e1; margin-bottom: 0.25rem; }
        .tp-card { background: #1e293b; border: 1px solid #334155; border-radius: 1rem; padding: 1.25rem; }
        .tp-table th, .tp-table td { padding: 0.375rem 0.5rem; text-align: right; white-space: nowrap; }
        .tp-table thead th { white-space: normal; vertical-align: bottom; }
        .tp-table th:first-child, .tp-table td:first-child { text-align: left; }
        .tp-table thead th { color: #94a3b8; font-weight: 600; border-bottom: 1px solid #334155; }
        .tp-table tbody tr + tr td { border-top: 1px solid #293548; }
        .tp-table { font-variant-numeric: tabular-nums; }
        .tp-swatch { display: inline-block; width: 0.75rem; height: 0.75rem; border-radius: 3px; margin-right: 0.5rem; }
        #carte { height: 36rem; border-radius: 0.75rem; background: #0f172a; z-index: 0; }
        .tp-commune { background: rgba(15, 23, 42, 0.85); color: #f1f5f9; border: 0; box-shadow: none;
                      font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 999px; }
        .tp-commune::before { display: none; }
        .tp-pill { cursor: pointer; padding: 0.375rem 0.875rem; border-radius: 999px; font-size: 0.8125rem;
                   font-weight: 600; color: #cbd5e1; border: 1px solid #475569; background: transparent; }
        .tp-pill[aria-pressed="true"] { background: #e2e8f0; color: #0f172a; border-color: #e2e8f0; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-full flex flex-col">

    <header class="bg-slate-800 border-b border-slate-700 px-4 md:px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-3">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-500 text-slate-950 p-2.5 rounded-xl flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide text-white">TERRAPULSE</h1>
                <p class="text-xs text-emerald-400 font-medium">Kivu EarthLab — Listen to Earth. Understand Change. Predict Tomorrow.</p>
            </div>
        </div>
        <div class="flex flex-wrap items-center justify-center gap-2 text-xs">
            <span class="px-3 py-1 bg-slate-700 text-slate-200 rounded-full border border-slate-600 font-medium" data-i18n="header.zone"></span>
            <span id="sourceBadge" class="px-3 py-1 bg-emerald-950 text-emerald-300 rounded-full border border-emerald-800 font-semibold"></span>
            <span class="flex gap-1 ml-1" role="group" aria-label="Langue / Language">
                <button class="tp-pill tp-lang" data-lang="fr" aria-pressed="true" title="Français">FR</button>
                <button class="tp-pill tp-lang" data-lang="en" aria-pressed="false" title="English">EN</button>
            </span>
        </div>
    </header>

    <main class="flex-1 p-4 md:p-6 max-w-7xl mx-auto w-full space-y-6">

        <!-- Filtres : une seule ligne, au-dessus de tout ce qu'ils pilotent -->
        <section class="tp-card grid grid-cols-2 md:grid-cols-4 gap-4 items-end">
            <div>
                <label class="tp-label" for="startDate" data-i18n="filter.start"></label>
                <input type="date" id="startDate" class="tp-input">
            </div>
            <div>
                <label class="tp-label" for="endDate" data-i18n="filter.end"></label>
                <input type="date" id="endDate" class="tp-input">
            </div>
            <div>
                <label class="tp-label" for="granularity" data-i18n="filter.step"></label>
                <select id="granularity" class="tp-input">
                    <option value="day" data-i18n="filter.step.day"></option>
                    <option value="week" data-i18n="filter.step.week"></option>
                    <option value="month" data-i18n="filter.step.month" selected></option>
                    <option value="year" data-i18n="filter.step.year"></option>
                </select>
            </div>
            <div>
                <label class="tp-label" for="forecastMonths" data-i18n="filter.horizon"></label>
                <select id="forecastMonths" class="tp-input">
                    <option value="3" data-i18n="filter.h3"></option>
                    <option value="6" data-i18n="filter.h6" selected></option>
                    <option value="12" data-i18n="filter.h12"></option>
                </select>
            </div>
            <p id="filterNote" class="col-span-2 md:col-span-4 text-xs text-slate-400 -mt-1"></p>
        </section>

        <div id="noData" class="hidden tp-card text-sm text-amber-200" data-i18n="nodata"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- Colonne gauche : diagnostic, seuils, export, sources -->
            <div class="space-y-6">
                <section class="tp-card">
                    <h2 class="text-lg font-semibold text-white mb-1" data-i18n="diag.title"></h2>
                    <p id="diagIntro" class="text-xs text-slate-400 mb-4"></p>
                    <div id="diagBody" class="space-y-3"></div>
                    <p class="text-[11px] text-slate-400 mt-4 leading-relaxed" data-i18n="diag.disclaimer"></p>
                </section>

                <section class="tp-card">
                    <h2 class="text-base font-semibold text-white mb-3" data-i18n="thr.title"></h2>
                    <div class="space-y-3">
                        <div>
                            <label class="tp-label" for="thrRain" data-i18n="thr.rain"></label>
                            <input type="number" id="thrRain" class="tp-input" step="5" min="0" value="150">
                        </div>
                        <div>
                            <label class="tp-label" for="thrHum" data-i18n="thr.hum"></label>
                            <input type="number" id="thrHum" class="tp-input" step="0.5" min="0" max="100">
                        </div>
                        <div>
                            <label class="tp-label" for="thrNdvi" data-i18n="thr.ndvi"></label>
                            <input type="number" id="thrNdvi" class="tp-input" step="0.01" min="-1" max="1" value="0.40">
                        </div>
                    </div>
                    <p id="thrNote" class="text-[11px] text-slate-400 mt-3 leading-relaxed"></p>
                </section>

                <section class="tp-card">
                    <h2 class="text-base font-semibold text-white mb-1" data-i18n="export.title"></h2>
                    <p class="text-xs text-slate-400 mb-3" data-i18n="export.desc"></p>
                    <div class="grid grid-cols-2 gap-3">
                        <button id="btnCsv" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-3 rounded-xl text-sm" data-i18n="export.csv"></button>
                        <button id="btnJson" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2 px-3 rounded-xl text-sm border border-slate-600" data-i18n="export.json"></button>
                    </div>
                </section>

                <section class="tp-card">
                    <h2 class="text-base font-semibold text-white mb-3" data-i18n="src.title"></h2>
                    <ul id="sourcesList" class="space-y-2 text-xs text-slate-300 leading-relaxed"></ul>
                    <div class="mt-4 pt-4 border-t border-slate-700">
                        <label class="tp-label" for="csvFileInput" data-i18n="csv.label"></label>
                        <input type="file" id="csvFileInput" accept=".csv" class="block w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-slate-100 hover:file:bg-slate-600 cursor-pointer">
                        <p id="csvStatus" class="text-[11px] text-slate-400 mt-1"></p>
                    </div>
                </section>
            </div>

            <!-- Colonne droite : un graphique par variable, chacun avec son interprétation -->
            <div class="lg:col-span-2 space-y-6">
                <section class="tp-card">
                    <h2 class="text-lg font-semibold text-white" data-i18n="chart.precipitation"></h2>
                    <p id="subRain" class="text-xs text-slate-400 mb-3"></p>
                    <div class="relative h-60 w-full"><canvas id="chartRain"></canvas></div>
                    <div id="interpRain" class="mt-4 pt-4 border-t border-slate-700 text-xs text-slate-300 space-y-2 leading-relaxed"></div>
                </section>
                <section class="tp-card">
                    <h2 class="text-lg font-semibold text-white" data-i18n="chart.humidity"></h2>
                    <p id="subHum" class="text-xs text-slate-400 mb-3"></p>
                    <div class="relative h-60 w-full"><canvas id="chartHum"></canvas></div>
                    <div id="interpHum" class="mt-4 pt-4 border-t border-slate-700 text-xs text-slate-300 space-y-2 leading-relaxed"></div>
                </section>
                <section class="tp-card">
                    <h2 class="text-lg font-semibold text-white" data-i18n="chart.ndvi"></h2>
                    <p id="subNdvi" class="text-xs text-slate-400 mb-3"></p>
                    <div class="relative h-60 w-full"><canvas id="chartNdvi"></canvas></div>
                    <div id="interpNdvi" class="mt-4 pt-4 border-t border-slate-700 text-xs text-slate-300 space-y-2 leading-relaxed"></div>
                </section>

                <section class="tp-card">
                    <h2 class="text-lg font-semibold text-white" data-i18n="fc.title"></h2>
                    <p id="modelNote" class="text-xs text-slate-400 mb-3"></p>
                    <div class="overflow-x-auto"><table id="forecastTable" class="tp-table w-full text-xs text-slate-200"></table></div>
                </section>

                <details class="tp-card">
                    <summary class="cursor-pointer text-sm font-semibold text-white" data-i18n="obs.summary"></summary>
                    <p id="obsTableNote" class="text-xs text-slate-400 mt-2"></p>
                    <div class="overflow-auto max-h-96 mt-2"><table id="obsTable" class="tp-table w-full text-xs text-slate-200"></table></div>
                </details>
            </div>
        </div>

        <!-- LOCATE : carte des versants vulnérables -->
        <section class="tp-card" id="sectionCarte">
            <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3 mb-3">
                <div>
                    <h2 class="text-lg font-semibold text-white" data-i18n="map.title"></h2>
                    <p id="carteSousTitre" class="text-xs text-slate-400"></p>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <div class="flex flex-wrap gap-2" role="group" aria-label="Couche affichée / Displayed layer">
                        <button class="tp-pill tp-couche" data-couche="indice" aria-pressed="true" data-i18n="map.btn.indice"></button>
                        <button class="tp-pill tp-couche" data-couche="pente" aria-pressed="false" data-i18n="map.btn.pente"></button>
                        <button class="tp-pill tp-couche" data-couche="ndvi" aria-pressed="false" data-i18n="map.btn.ndvi"></button>
                    </div>
                    <span class="hidden sm:block w-px h-6 bg-slate-600" aria-hidden="true"></span>
                    <div class="flex flex-wrap gap-2" role="group" aria-label="Fond de carte / Basemap">
                        <button class="tp-pill tp-fond" data-fond="plan" aria-pressed="true" data-i18n="map.fond.plan"></button>
                        <button class="tp-pill tp-fond" data-fond="satellite" aria-pressed="false" data-i18n="map.fond.satellite"></button>
                    </div>
                </div>
            </div>
            <p id="carteSaison" class="text-sm text-slate-200 mb-3"></p>
            <div id="carte"></div>
            <div id="carteLegende" class="flex flex-wrap items-center gap-x-4 gap-y-1 mt-3 text-xs text-slate-300"></div>
            <p id="carteNote" class="text-[11px] text-slate-400 mt-2 leading-relaxed"></p>

            <h3 id="communesTitre" class="text-base font-semibold text-white mt-5 mb-2" data-i18n="map.communes"></h3>
            <div class="overflow-x-auto"><table id="communesTable" class="tp-table w-full text-xs text-slate-200"></table></div>
            <ul id="carteSources" class="mt-4 pt-4 border-t border-slate-700 space-y-1 text-[11px] text-slate-400 leading-relaxed"></ul>
        </section>
    </main>

    <footer id="footer" class="bg-slate-800 border-t border-slate-700 text-center py-3 px-4 text-xs text-slate-400"></footer>

<script>
'use strict';

/* =====================================================================

const I18N = {

    'imp.hum.mid': 'Le sol n\'approche la saturation que quelques mois, en cœur de saison des pluies. C\'est pendant ces mois que les versants sont les plus fragiles, car l\'eau ne s\'infiltre plus et la pression dans le sol augmente.',

let LANG = 'fr';
function t(cle, vals) {
    let s = I18N[LANG][cle];
    if (s === undefined) s = I18N.fr[cle];
    if (s === undefined) return cle;
    return typeof s === 'function' ? s(vals || {}) : s;
}

function langueInitiale() {
    const h = location.hash.replace('#', '').toLowerCase();
    if (I18N[h]) return h;
    try { const m = localStorage.getItem('terrapulse-lang'); if (I18N[m]) return m; } catch (e) { /* stockage indisponible */ }
    return (navigator.language || 'fr').toLowerCase().startsWith('fr') ? 'fr' : 'en';
}

 * 1. Configuration
 * ===================================================================== */

                     canvas: 'chartNdvi', interp: 'interpNdvi', sub: 'subNdvi', type: 'line', min: -1, max: 1 },
};
const VAR_KEYS = Object.keys(VARS);
const Z80 = 1.30;            // demi-largeur de l'intervalle à 80 % (loi de Student, ~45 degrés de liberté)
const MIN_MOIS_MODELE = 24;  // il faut au moins deux cycles saisonniers pour apprendre

const state = {
    base: 'day',             // résolution native des données : 'day' ou 'month'
    obs: { precipitation: [], humidity: [], ndvi: [] },   // [{d:'AAAA-MM-JJ', v:nombre}]
    fichierCsv: null,        // nom du CSV importé, ou null si données NASA

    charts: {},
    dernier: null,           // dernier rendu (pour l'export)
};

/* =====================================================================
 * 2. Utilitaires dates et nombres (tout en UTC, à partir de chaînes ISO)
 * ===================================================================== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const utc = d => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10));
const iso = t0 => new Date(t0).toISOString().slice(0, 10);
const joursDansMois = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();   // m = 1..12
const lundi = d => { const t0 = utc(d); return iso(t0 - ((new Date(t0).getUTCDay() + 6) % 7) * 864e5); };
const idxMois = cle => (+cle.slice(0, 4)) * 12 + (+cle.slice(5, 7) - 1);
const cleMois = idx => `${Math.floor(idx / 12)}-${pad(idx % 12 + 1)}`;
const fmt = (v, dec) => (v === null || v === undefined || Number.isNaN(v)) ? '—'
    : v.toLocaleString(I18N[LANG].locale, { minimumFractionDigits: dec, maximumFractionDigits: dec });
const pct = p => Math.round(p * 100) + (LANG === 'fr' ? ' %' : '%');
const borne = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const sourceDe = k => state.fichierCsv ? t('src.csv', { f: state.fichierCsv }) : t('src.' + k);

function cleDe(d, gran) {
    if (gran === 'day') return d;
    if (gran === 'week') return lundi(d);
    if (gran === 'month') return d.slice(0, 7);
    return d.slice(0, 4);
}

function el(tag, cls, texte) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (texte !== undefined) e.textContent = texte;
    return e;
}

/* Fonction de répartition de la loi normale */
function phi(z) {
    const k = 1 / (1 + 0.2316419 * Math.abs(z));
    const d = 0.3989423 * Math.exp(-z * z / 2);
    const p = d * k * (0.3193815 + k * (-0.3565638 + k * (1.781478 + k * (-1.821256 + k * 1.330274))));
    return z > 0 ? 1 - p : p;
}

function quantile(vals, q) {
    const s = [...vals].sort((a, b) => a - b);
    if (!s.length) return NaN;
    const pos = (s.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
    return s[lo] + (s[hi] - s[lo]) * (pos - lo);
}

/* =====================================================================
 * 3. Chargement des données
 * ===================================================================== */
function chargerDonneesNasa() {
    const D = window.TERRAPULSE_DATA;
    if (!D) return false;
    const t0 = utc(D.journalier.debut);
    const versObs = arr => arr.map((v, i) => ({ d: iso(t0 + i * 864e5), v })).filter(o => o.v !== null);
    state.base = 'day';
    state.obs.precipitation = versObs(D.journalier.precipitation);
    state.obs.humidity = versObs(D.journalier.humidity);
    state.obs.ndvi = D.ndvi.map(([d, v]) => ({ d, v }));
    state.meta = D.meta;
    state.fichierCsv = null;
    return true;
}

function chargerCsvMensuel(texte, nomFichier) {
    const lignes = texte.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#'));
    const h = lignes.findIndex(l => l.toLowerCase().includes('date') && l.toLowerCase().includes('precipitation'));
    if (h === -1) return 0;
    const obs = { precipitation: [], humidity: [], ndvi: [] };
    for (const l of lignes.slice(h + 1)) {
        const c = l.split(',');
        const d = (c[0] || '').trim();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;
        VAR_KEYS.forEach((k, i) => {
            const v = parseFloat(c[i + 1]);
            if (!Number.isNaN(v)) obs[k].push({ d, v });
        });
    }
    const n = obs.precipitation.length;
    if (!n) return 0;
    state.base = 'month';
    state.obs = obs;
    state.meta = null;
    state.fichierCsv = nomFichier;
    return n;
}

function aDesDonnees() { return VAR_KEYS.some(k => state.obs[k].length); }

function initialiserFiltres() {
    const toutes = VAR_KEYS.flatMap(k => state.obs[k].map(o => o.d)).sort();
    if (!toutes.length) return;
    const debut = state.base === 'month' ? toutes[0].slice(0, 8) + '01' : toutes[0];
    const fin = toutes[toutes.length - 1];
    for (const id of ['startDate', 'endDate']) { $(id).min = debut; $(id).max = fin; }
    $('startDate').value = debut;
    $('endDate').value = fin;

    const g = $('granularity');
    for (const o of g.options) o.disabled = state.base === 'month' && (o.value === 'day' || o.value === 'week');
    if (g.selectedOptions[0].disabled) g.value = 'month';

    // Seuil d'humidité calibré sur les données : 80e centile des moyennes mensuelles
    const mensuel = [...agreger('humidity', 'month', debut, fin).values()];
    $('thrHum').value = (Math.round(quantile(mensuel, 0.8) * 2) / 2).toFixed(1);
}

/* Textes fixes et textes liés à l'origine des données : refaits à chaque changement de langue */
function appliquerTextes() {

/* =====================================================================
 * 4. Agrégation temporelle
 * ===================================================================== */
/* Renvoie Map(clé de période -> valeur) : somme pour la pluie, moyenne pour le reste. */
function agreger(varKey, gran, debut, fin) {
    const acc = new Map();
    for (const o of state.obs[varKey]) {
        if (o.d < debut || o.d > fin) continue;
        const k = cleDe(o.d, gran);
        const a = acc.get(k) || { s: 0, n: 0 };
        a.s += o.v; a.n++;
        acc.set(k, a);
    }
    const res = new Map();
    const somme = VARS[varKey].how === 'sum';
    for (const [k, a] of acc) {
        // Pluie mensuelle issue de données journalières : on ne garde que les mois entièrement couverts
        if (somme && gran === 'month' && state.base === 'day'
            && a.n < joursDansMois(+k.slice(0, 4), +k.slice(5, 7))) continue;
        res.set(k, somme ? a.s : a.s / a.n);
    }
    return res;
}

/* =====================================================================
 * 5. Modèle : saisonnalité mensuelle + tendance linéaire (moindres carrés)
 * ===================================================================== */
function inverser(A) {
    const n = A.length;
    const M = A.map((r, i) => [...r, ...Array.from({ length: n }, (_, j) => (i === j ? 1 : 0))]);
    for (let c = 0; c < n; c++) {
        let p = c;
        for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
        if (Math.abs(M[p][c]) < 1e-12) return null;
        [M[c], M[p]] = [M[p], M[c]];
        const piv = M[c][c];
        for (let j = 0; j < 2 * n; j++) M[c][j] /= piv;
        for (let r = 0; r < n; r++) {
            if (r === c) continue;
            const f = M[r][c];
            if (f) for (let j = 0; j < 2 * n; j++) M[r][j] -= f * M[c][j];
        }
    }
    return M.map(r => r.slice(n));
}

/* lignes : [{t: indice absolu du mois, y}] */
function ajuster(lignes, avecTendance) {
    const p = 12 + (avecTendance ? 1 : 0), n = lignes.length;
    if (n <= p) return null;
    const tMoy = lignes.reduce((s, r) => s + r.t, 0) / n;
    const vecteur = tt => {
        const x = new Array(p).fill(0);
        x[((tt % 12) + 12) % 12] = 1;
        if (avecTendance) x[12] = tt - tMoy;
        return x;
    };
    const XtX = Array.from({ length: p }, () => new Array(p).fill(0));
    const Xty = new Array(p).fill(0);
    for (const r of lignes) {
        const x = vecteur(r.t);
        for (let i = 0; i < p; i++) {
            if (!x[i]) continue;
            Xty[i] += x[i] * r.y;
            for (let j = 0; j < p; j++) XtX[i][j] += x[i] * x[j];
        }
    }
    const inv = inverser(XtX);
    if (!inv) return null;
    const beta = inv.map(row => row.reduce((s, v, j) => s + v * Xty[j], 0));
    const moyenne = tt => vecteur(tt).reduce((s, v, i) => s + v * beta[i], 0);
    const rss = lignes.reduce((s, r) => s + (r.y - moyenne(r.t)) ** 2, 0);
    const sigma2 = rss / (n - p);
    const prevoir = tt => {
        const x = vecteur(tt);
        let lev = 0;
        for (let i = 0; i < p; i++) for (let j = 0; j < p; j++) lev += x[i] * inv[i][j] * x[j];
        return { mu: moyenne(tt), se: Math.sqrt(sigma2 * (1 + lev)) };
    };
    return { n, prevoir, pente: avecTendance ? beta[12] : 0,
             penteSe: avecTendance ? Math.sqrt(sigma2 * inv[12][12]) : 0, sigma: Math.sqrt(sigma2) };
}

/* Apprend une variable. La tendance n'est conservée dans la prévision que si elle est
 * statistiquement significative (|pente| > 2 erreurs standard) : sur 5 ans, extrapoler
 * une pente incertaine donnerait des prévisions fausses. */
function apprendre(serieMensuelle) {
    const lignes = [...serieMensuelle].map(([k, y]) => ({ t: idxMois(k), y }));
    if (lignes.length < MIN_MOIS_MODELE) return null;
    const complet = ajuster(lignes, true);
    if (!complet) return null;
    const significative = complet.penteSe > 0 && Math.abs(complet.pente) > 2 * complet.penteSe;
    const retenu = significative ? complet : (ajuster(lignes, false) || complet);
    return { n: lignes.length, prevoir: retenu.prevoir, significative,
             penteAn: complet.pente * 12, penteAnSe: complet.penteSe * 12 };
}

function prevoirTout(mensuel, horizon, seuils) {
    const modeles = {};
    for (const k of VAR_KEYS) modeles[k] = apprendre(mensuel[k]);
    if (VAR_KEYS.some(k => !modeles[k])) return { modeles, mois: [] };

    const dernier = Math.max(...VAR_KEYS.map(k => Math.max(...[...mensuel[k].keys()].map(idxMois))));
    const mois = [];
    for (let h = 1; h <= horizon; h++) {
        const tt = dernier + h;
        const ligne = { periode: cleMois(tt) };
        for (const k of VAR_KEYS) {
            const { mu, se } = modeles[k].prevoir(tt);
            const V = VARS[k];
            ligne[k] = { mu: borne(mu, V.min, V.max), bas: borne(mu - Z80 * se, V.min, V.max),
                         haut: borne(mu + Z80 * se, V.min, V.max), muBrut: mu, se };
        }
        const P = (k, seuil, auDessus) => {
            const z = (seuil - ligne[k].muBrut) / ligne[k].se;
            return auDessus ? 1 - phi(z) : phi(z);
        };
        ligne.pPluie = P('precipitation', seuils.pluie, true);
        ligne.pHum = P('humidity', seuils.hum, true);
        ligne.pNdvi = P('ndvi', seuils.ndvi, false);
        // Glissement : sol déjà saturé ET fortes pluies. Érosion : fortes pluies sur un couvert végétal affaibli.
        ligne.glissement = (ligne.pPluie >= 0.5 && ligne.pHum >= 0.5) ? 2
            : (ligne.pPluie >= 0.5 || ligne.pHum >= 0.5) ? 1 : 0;
        ligne.erosion = (ligne.pPluie >= 0.5 && ligne.pNdvi >= 0.5) ? 2
            : (ligne.pPluie >= 0.5 || (ligne.pNdvi >= 0.5 && ligne.pPluie >= 0.25)) ? 1 : 0;
        mois.push(ligne);
    }
    return { modeles, mois };
}

/* =====================================================================
 * 6. Graphiques
 * ===================================================================== */
const reticule = {
    id: 'reticule',
    afterDatasetsDraw(chart) {
        const actifs = chart.tooltip && chart.tooltip.getActiveElements ? chart.tooltip.getActiveElements() : [];
        if (!actifs.length) return;
        const x = actifs[0].element.x, { top, bottom } = chart.chartArea, ctx = chart.ctx;
        ctx.save();
        ctx.strokeStyle = COLORS.cross; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
        ctx.restore();
    },
};

function dessiner(varKey, labels, nbObs, serie, prev, seuil) {
    const V = VARS[varKey];
    const hist = labels.map((k, i) => (i < nbObs && serie.has(k)) ? serie.get(k) : null);
    const dense = nbObs > 150;
    const datasets = [{
        label: t('ds.obs'), role: 'obs', type: V.type, data: hist,
        borderColor: V.color, backgroundColor: V.type === 'bar' ? V.color : 'transparent',
        borderWidth: V.type === 'bar' ? 0 : 2, borderRadius: dense ? 0 : 3,
        pointRadius: dense ? 0 : 2.5, pointHoverRadius: 5, pointBackgroundColor: V.color,
        tension: 0, spanGaps: true, order: 3,
    }];

    if (prev.length) {
        const vide = () => new Array(labels.length).fill(null);
        const med = vide(), bas = vide(), haut = vide();
        prev.forEach((m, j) => {
            med[nbObs + j] = m[varKey].mu; bas[nbObs + j] = m[varKey].bas; haut[nbObs + j] = m[varKey].haut;
        });
        // Pour les courbes, on raccorde la prévision au dernier point observé
        if (V.type === 'line') {
            let d = nbObs - 1;
            while (d >= 0 && hist[d] === null) d--;
            if (d >= 0) med[d] = bas[d] = haut[d] = hist[d];
        }
        const ligne = { type: 'line', pointRadius: 0, pointHoverRadius: 0, tension: 0, spanGaps: true };
        datasets.push(
            { ...ligne, label: t('ds.med'), role: 'med', data: med, borderColor: V.color,
              borderWidth: 2, borderDash: [6, 4], pointRadius: 2.5, pointHoverRadius: 5,
              pointBackgroundColor: '#1e293b', pointBorderColor: V.color, order: 1 },
            { ...ligne, label: 'bas', role: 'bas', data: bas, borderWidth: 0, order: 4 },
            { ...ligne, label: t('ds.band'), role: 'haut', data: haut, borderWidth: 0,
              backgroundColor: V.color + '40', fill: '-1', order: 4 },
        );
    }
    if (seuil !== null) {
        datasets.push({ type: 'line', label: t('ds.thr', { v: fmt(seuil, V.dec === 3 ? 2 : 1) + (V.unite ? ' ' + V.unite : '') }),
            role: 'seuil', data: labels.map(() => seuil), borderColor: COLORS.seuil, borderWidth: 1,
            borderDash: [2, 4], pointRadius: 0, pointHoverRadius: 0, order: 0 });
    }

    if (state.charts[varKey]) state.charts[varKey].destroy();
    state.charts[varKey] = new Chart($(V.canvas), {
        type: V.type,
        data: { labels, datasets },
        plugins: [reticule],
        options: {
            responsive: true, maintainAspectRatio: false, animation: false, locale: I18N[LANG].locale,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: {
                    display: datasets.length > 1,
                    labels: { color: COLORS.ink, boxWidth: 16, boxHeight: 8, font: { size: 11 },
                              filter: item => datasets[item.datasetIndex].role !== 'bas',
                              sort: (a, b) => a.datasetIndex - b.datasetIndex },
                },
                tooltip: {
                    filter: item => item.dataset.role !== 'bas' && item.raw !== null,
                    callbacks: {
                        label(ctx) {
                            const u = V.unite ? ' ' + V.unite : '';
                            if (ctx.dataset.role === 'haut') {
                                const b = ctx.chart.data.datasets.find(d => d.role === 'bas').data[ctx.dataIndex];
                                return ' ' + t('tip.band', { a: fmt(b, V.dec), b: fmt(ctx.raw, V.dec), u });
                            }
                            if (ctx.dataset.role === 'seuil') return ' ' + ctx.dataset.label;
                            return ` ${fmt(ctx.raw, V.dec)}${u} — ${ctx.dataset.label}`;
                        },
                    },
                },
            },
            scales: {
                x: { ticks: { color: COLORS.axis, maxTicksLimit: 12, maxRotation: 0, font: { size: 11 } },
                     grid: { display: false }, border: { color: COLORS.grid } },
                y: { beginAtZero: V.type === 'bar', ticks: { color: COLORS.axis, font: { size: 11 } },
                     grid: { color: COLORS.grid }, border: { display: false },
                     title: { display: !!V.unite, text: V.unite, color: COLORS.axis, font: { size: 11 } } },
            },
        },
    });
}

/* =====================================================================
 * 7. Interprétations dynamiques (calculées sur les mois de la période)
 * ===================================================================== */
function tendanceTexte(modele, V) {
    if (!modele) return t('trend.short', { min: MIN_MOIS_MODELE });
    const val = `${modele.penteAn >= 0 ? '+' : '−'}${fmt(Math.abs(modele.penteAn), V.dec)} ± ${fmt(2 * modele.penteAnSe, V.dec)} ${t('trend.unit', { u: V.unite })}`;
    return t(modele.significative ? 'trend.sig' : 'trend.ns', { val });
}

function interpreter(varKey, serie, modele, seuil) {
    const V = VARS[varKey], cible = $(V.interp);
    cible.replaceChildren();
    const lignes = [...serie];
    if (!lignes.length) { cible.append(el('p', '', t('interp.empty'))); return; }

    const vals = lignes.map(l => l[1]), n = vals.length;
    const moy = vals.reduce((a, b) => a + b, 0) / n;
    const iMax = vals.indexOf(Math.max(...vals)), iMin = vals.indexOf(Math.min(...vals));
    const u = V.unite ? ' ' + V.unite : '';
    const sous = varKey === 'ndvi';
    const hors = lignes.filter(l => sous ? l[1] < seuil : l[1] > seuil);
    const part = hors.length / n;

    const lecture = t('interp.stats', {
        n, pluie: varKey === 'precipitation', sous,
        moy: fmt(moy, V.dec) + u, max: fmt(vals[iMax], V.dec) + u, kMax: lignes[iMax][0],
        min: fmt(vals[iMin], V.dec) + u, kMin: lignes[iMin][0],
        nHors: hors.length, seuil: fmt(seuil, sous ? 2 : 1) + u,
        dernier: hors.length ? hors[hors.length - 1][0] : '',
    });

    const fam = { precipitation: 'rain', humidity: 'hum', ndvi: 'ndvi' }[varKey];
    const niveau = part >= 0.3 ? 'hi' : part > 0 ? 'mid' : 'none';
    let impact = t(`imp.${fam}.${niveau}`, { k: part > 0 ? Math.max(2, Math.round(1 / part)) : 0 });
    if (varKey === 'ndvi' && modele && modele.significative && modele.penteAn < 0) impact += t('imp.ndvi.decline');
    impact += t(`imp.${fam}.tail`);

    const p1 = el('p'); p1.append(el('strong', 'text-slate-100', t('interp.read')), document.createTextNode(lecture + ' ' + tendanceTexte(modele, V)));
    const p2 = el('p'); p2.append(el('strong', 'text-slate-100', t('interp.impact')), document.createTextNode(impact));
    cible.append(p1, p2);
}

/* =====================================================================
 * 8. Diagnostic et tableaux

const NIVEAUX = [
    { symbole: '●', fond: '#0ca30c', encre: '#ffffff' },
    { symbole: '▲', fond: '#fab219', encre: '#0b0b0b' },
    { symbole: '◆', fond: '#d03b3b', encre: '#ffffff' },
];

function badge(niveau) {
    const N = NIVEAUX[niveau];
    const b = el('span', 'inline-block px-2 py-0.5 rounded-full text-[11px] font-bold', `${N.symbole} ${t('level.' + niveau)}`);
    b.style.background = N.fond; b.style.color = N.encre;
    return b;
}

function afficherDiagnostic(prev, horizon, mensuel) {
    const corps = $('diagBody');
    corps.replaceChildren();
    if (!prev.mois.length) {
        const n = Math.min(...VAR_KEYS.map(k => mensuel[k].size));
        $('diagIntro').textContent = '';
        corps.append(el('p', 'text-sm text-amber-200', t('diag.unavailable', { n, min: MIN_MOIS_MODELE })));
        return;
    }
    $('diagIntro').textContent = t('diag.intro', { h: horizon, a: prev.mois[0].periode, b: prev.mois[prev.mois.length - 1].periode });
    for (const [cle, id] of [['glissement', 'landslide'], ['erosion', 'erosion']]) {
        const pire = Math.max(...prev.mois.map(m => m[cle]));
        const concernes = prev.mois.filter(m => m[cle] === pire && pire > 0).map(m => m.periode);
        const bloc = el('div', 'rounded-xl bg-slate-900 border border-slate-700 p-3');
        const tete = el('div', 'flex items-center justify-between gap-2 mb-1');
        tete.append(el('span', 'text-sm font-semibold text-white', t('diag.' + id)), badge(pire));
        bloc.append(tete, el('p', 'text-xs text-slate-400', t(`diag.${id}.cause`)));
        bloc.append(el('p', 'text-xs text-slate-200 mt-1', pire === 0 ? t('diag.none')
            : t('diag.months', { m: concernes.join(', '), action: t(`diag.${id}.action`) })));
        corps.append(bloc);
    }
}

function afficherTableauPrevision(prev) {
    const table = $('forecastTable');
    table.replaceChildren();
    $('modelNote').textContent = prev.mois.length ? t('fc.note', { n: prev.modeles.precipitation.n }) : '';
    if (!prev.mois.length) return;
    const thead = el('thead'), trh = el('tr');
    t('fc.cols').forEach(c => trh.append(el('th', '', c)));
    thead.append(trh);
    const tbody = el('tbody');
    for (const m of prev.mois) {
        const tr = el('tr');
        const cellule = k => { const d = VARS[k].dec === 3 ? 2 : 0; return `${fmt(m[k].mu, d)} [${fmt(m[k].bas, d)} – ${fmt(m[k].haut, d)}]`; };
        tr.append(el('td', 'font-semibold', m.periode),
            el('td', '', cellule('precipitation')), el('td', '', pct(m.pPluie)),

function afficherTableauObs(labels, series, gran) {

    table.replaceChildren();

    t('obs.cols').forEach(c => trh.append(el('th', 'sticky top-0 bg-slate-800', c)));

/* =====================================================================
 * 9. Rendu global : tout dépend des mêmes filtres
 * ===================================================================== */
function rendre() {
    const tout = aDesDonnees();
    $('noData').classList.toggle('hidden', tout);
    if (!tout) return;

    let debut = $('startDate').value, fin = $('endDate').value;
    if (!debut || !fin) return;
    if (debut > fin) [debut, fin] = [fin, debut];
    const gran = $('granularity').value;
    const horizon = +$('forecastMonths').value;
    const seuils = { pluie: +$('thrRain').value, hum: +$('thrHum').value, ndvi: +$('thrNdvi').value };
    const seuilDe = { precipitation: seuils.pluie, humidity: seuils.hum, ndvi: seuils.ndvi };

    const series = {}, mensuel = {};
    for (const k of VAR_KEYS) {
        series[k] = agreger(k, gran, debut, fin);
        mensuel[k] = gran === 'month' ? series[k] : agreger(k, 'month', debut, fin);
    }
    const prev = prevoirTout(mensuel, horizon, seuils);

    const labelsObs = [...new Set(VAR_KEYS.flatMap(k => [...series[k].keys()]))].sort();
    const prevSurGraphe = gran === 'month' ? prev.mois : [];
    const labels = [...labelsObs, ...prevSurGraphe.map(m => m.periode)];

    const g = t('gran.' + gran);
    const ndvi16 = (gran === 'day' || gran === 'week') && state.base === 'day';
    for (const k of VAR_KEYS) {
        $(VARS[k].sub).textContent = (k === 'ndvi' && ndvi16) ? t('sub.ndvi.16') : t('sub.' + k, { g });
        // Le seuil de pluie est mensuel : on ne le trace qu'au pas mensuel
        const seuilGraphe = (k === 'precipitation' && gran !== 'month') ? null : seuilDe[k];
        dessiner(k, labels, labelsObs.length, series[k], prevSurGraphe, seuilGraphe);
        interpreter(k, mensuel[k], prev.modeles[k], seuilDe[k]);
    }

    $('filterNote').textContent = t(gran === 'month' ? 'filter.note.month' : 'filter.note.other');
    $('thrNote').textContent = t(state.base === 'day' ? 'thr.note.nasa' : 'thr.note.csv');

    afficherDiagnostic(prev, horizon, mensuel);
    afficherSaisonCarte(prev);
    afficherTableauPrevision(prev);
    afficherTableauObs(labelsObs, series, gran);
    state.dernier = { debut, fin, gran, horizon, seuils, labelsObs, series, prev };
}

/* =====================================================================
 * 9 bis. Carte (pilier LOCATE)
 * Chaque cellule de 231 m (grille MODIS) porte une pente (SRTM), un NDVI et un indice.
 * ===================================================================== */
const COUCHES = {
    indice: { bornes: [0.2, 0.4, 0.6, 0.8], couleurs: ['#fde8d7', '#f9b98d', '#ee7a3c', '#bf4514', '#7a2606'] },
    pente:  { bornes: [5, 10, 15, 25],      couleurs: ['#cde2fb', '#86b6ef', '#3987e5', '#1c5cab', '#0d366b'] },
    ndvi:   { bornes: [0.3, 0.4, 0.5, 0.6], couleurs: ['#e3f3da', '#b0dc9c', '#63b35d', '#22803a', '#0b4f20'] },
};
const carteEtat = { map: null, tuiles: null, cellules: [], couche: 'indice', fond: 'plan', prete: false };

function classeDe(couche, v) {
    const b = COUCHES[couche].bornes;
    let i = 0;
    while (i < b.length && v >= b[i]) i++;
    return i;
}

/* Fonds de carte.

 * interdit l'usage de ses tuiles par une application distribuée. CARTO exige
 * désormais une clé API. Esri publie ces fonds sans clé, y compris en file://. */

function initialiserCarte() {
    const C = window.TERRAPULSE_DATA && window.TERRAPULSE_DATA.carte;
    const section = $('sectionCarte');
    if (!C || typeof L === 'undefined') {
        const msg = el('p', 'text-sm text-amber-200');
        msg.dataset.i18n = !C ? 'map.nodata' : 'map.nolib';
        msg.textContent = t(msg.dataset.i18n);
        $('carte').replaceWith(msg);
        section.querySelectorAll('.tp-couche, .tp-fond, #communesTable, #communesTitre').forEach(e => e.classList.add('hidden'));
        return;
    }
    const G = C.grille, R = C.rayon_sinusoidal;
    const versLatLon = (x, y) => { const lat = y / R; return [lat * 180 / Math.PI, x / (R * Math.cos(lat)) * 180 / Math.PI]; };

    const map = L.map('carte', { preferCanvas: true, scrollWheelZoom: false, zoomSnap: 0.25 });
    carteEtat.map = map;
    map.attributionControl.setPrefix('Leaflet');

    // Une cellule = un quadrilatère (la grille sinusoïdale MODIS n'est pas alignée sur les méridiens)
    for (let p = 0; p < C.indice.length; p++) {
        if (C.indice[p] === null) continue;            // lac ou donnée absente
        const r = Math.floor(p / G.ncols), c = p % G.ncols;
        const x0 = G.xll + c * G.cs, x1 = x0 + G.cs;
        const y1 = G.yll + (G.nrows - r) * G.cs, y0 = y1 - G.cs;
        const poly = L.polygon([versLatLon(x0, y1), versLatLon(x1, y1), versLatLon(x1, y0), versLatLon(x0, y0)],
            { stroke: false, fillOpacity: 0.72 }).addTo(map);
        poly.bindTooltip(() => {     // contenu construit au survol, donc dans la langue courante
            const boite = el('div');
            const ligne = ([gras, reste]) => { const d = el('div'); d.append(el('strong', '', gras), document.createTextNode(' ' + reste)); boite.append(d); };
            ligne(t('map.tip.indice', { v: fmt(C.indice[p], 2), c: t('layer.indice.classes')[classeDe('indice', C.indice[p])] }));
            ligne(t('map.tip.pente', { v: fmt(C.pente[p], 1) + '°' }));
            ligne(t('map.tip.ndvi', { v: fmt(C.ndvi[p], 2) }));
            ligne(t('map.tip.alt', { v: fmt(C.altitude[p], 0) + ' m' }));
            return boite;
        }, { sticky: true });
        carteEtat.cellules.push({ p, poly });
    }

    for (const com of C.communes) {
        const anneau = com.anneau.map(([lon, lat]) => [lat, lon]);
        L.polygon(anneau, { color: '#0f172a', weight: 2.5, fill: false, interactive: false }).addTo(map);
        L.polygon(anneau, { color: '#ffffff', weight: 1, fill: false, interactive: false, dashArray: '4 4' }).addTo(map)
            .bindTooltip(com.nom, { permanent: true, direction: 'center', className: 'tp-commune' });
    }
    map.fitBounds(L.latLngBounds(carteEtat.cellules.map(o => o.poly.getBounds())), { padding: [4, 4] });

    section.querySelectorAll('.tp-couche').forEach(b => b.addEventListener('click', () => {
        section.querySelectorAll('.tp-couche').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        carteEtat.couche = b.dataset.couche;
        colorerCarte();
    }));
    section.querySelectorAll('.tp-fond').forEach(b => b.addEventListener('click', () => {
        section.querySelectorAll('.tp-fond').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        carteEtat.fond = b.dataset.fond;
        afficherFond();
    }));
    carteEtat.prete = true;
    afficherTextesCarte();
}

/* Fond de carte courant : « plan » (clair) ou « satellite ». Recréé au changement
 * de langue pour mettre l'attribution à jour. */
function afficherFond() {
    if (!carteEtat.prete) return;
    const map = carteEtat.map, F = FONDS_CARTE[carteEtat.fond];
    if (carteEtat.tuiles) { map.removeLayer(carteEtat.tuiles); carteEtat.tuiles = null; }
    carteEtat.tuiles = L.tileLayer(F.url,
        Object.assign({ attribution: t(F.attribution) }, F.options)).addTo(map);
    carteEtat.tuiles.bringToBack();
}

/* Tout ce qui est texte dans la section carte : refait à chaque changement de langue */
function afficherTextesCarte() {
    if (!carteEtat.prete) return;
    const C = window.TERRAPULSE_DATA.carte;

    afficherFond();

    const table = $('communesTable');
    table.replaceChildren();
    const trh = el('tr');
    t('map.cols').forEach(c => trh.append(el('th', '', c)));
    const thead = el('thead'); thead.append(trh);
    const tbody = el('tbody');
    for (const com of C.communes) {
        const s = com.stats, tr = el('tr');
        tr.append(el('td', 'font-semibold', com.nom), el('td', '', fmt(s.surface_km2, 1) + ' km²'),
            el('td', '', s.surface_commune_km2 ? pct(Math.min(1, s.surface_km2 / s.surface_commune_km2)) : '—'),
            el('td', '', fmt(s.pente_moyenne, 1) + '°'), el('td', '', pct(s.part_pente_sup_15)),
            el('td', '', fmt(s.ndvi_moyen, 2)), el('td', '', fmt(s.indice_moyen, 2)), el('td', '', pct(s.part_indice_sup_04)));
        tbody.append(tr);
    }
    table.append(thead, tbody);

    const F = C.formule;
    $('carteNote').textContent = t('map.note', { p: fmt(F.pente_ref, 0), d: fmt(F.ndvi_dense, 2), nu: fmt(F.ndvi_nu, 2) });
    const ul = $('carteSources');
    ul.replaceChildren();
    for (const cle of ['pente', 'ndvi', 'communes']) {
        const li = el('li');
        li.append(el('strong', 'text-slate-300', t(`map.src.${cle}.label`) + (LANG === 'fr' ? ' : ' : ': ')), document.createTextNode(t('map.src.' + cle)));
        ul.append(li);
    }
    colorerCarte();
}

function colorerCarte() {
    if (!carteEtat.prete) return;
    const C = window.TERRAPULSE_DATA.carte, K = COUCHES[carteEtat.couche];
    for (const { p, poly } of carteEtat.cellules) {
        const v = C[carteEtat.couche][p];
        poly.setStyle(v === null ? { fillOpacity: 0 } : { fillOpacity: 0.72, fillColor: K.couleurs[classeDe(carteEtat.couche, v)] });
    }
    $('carteSousTitre').textContent = t('map.sub', { t: t('layer.' + carteEtat.couche) });
    const leg = $('carteLegende');
    leg.replaceChildren();
    t(`layer.${carteEtat.couche}.classes`).forEach((nom, i) => {
        const item = el('span', 'inline-flex items-center');
        const sw = el('span', 'tp-swatch'); sw.style.background = K.couleurs[i];
        item.append(sw, document.createTextNode(nom));
        leg.append(item);
    });
}

/* Relie la carte (où) à la prévision (quand) */
function afficherSaisonCarte(prev) {
    const cible = $('carteSaison');
    if (!cible) return;
    cible.replaceChildren();
    if (!prev.mois.length) return;
    const pire = Math.max(...prev.mois.map(m => m.glissement));
    const moisPire = prev.mois.filter(m => m.glissement === pire).map(m => m.periode);
    cible.append(el('strong', 'text-white', t('map.where')));
    cible.append(document.createTextNode(pire === 0 ? t('map.season.none')
        : t('map.season', { m: moisPire.join(', '), l: t('level.' + pire) })));
}

/* =====================================================================
 * 10. Export CSV / JSON (les noms de colonnes restent fixes, quelle que soit la langue)
 * ===================================================================== */
const arr = (v, dec) => (v === undefined || v === null) ? null : +v.toFixed(dec);

function construireExport() {
    const R = state.dernier, niveaux = t('export.levels');
    const observations = R.labelsObs.map(k => ({
        periode: k,
        precipitation_mm: arr(R.series.precipitation.get(k), 1),
        humidite_sol_pourcent: arr(R.series.humidity.get(k), 1),
        ndvi: arr(R.series.ndvi.get(k), 3),
    }));
    const previsions = R.prev.mois.map(m => ({
        periode: m.periode,
        precipitation_mm: arr(m.precipitation.mu, 1), precipitation_bas: arr(m.precipitation.bas, 1), precipitation_haut: arr(m.precipitation.haut, 1),
        humidite_sol_pourcent: arr(m.humidity.mu, 1), humidite_bas: arr(m.humidity.bas, 1), humidite_haut: arr(m.humidity.haut, 1),
        ndvi: arr(m.ndvi.mu, 3), ndvi_bas: arr(m.ndvi.bas, 3), ndvi_haut: arr(m.ndvi.haut, 3),
        proba_pluie_sup_seuil: arr(m.pPluie, 2), proba_humidite_sup_seuil: arr(m.pHum, 2), proba_ndvi_inf_seuil: arr(m.pNdvi, 2),
        risque_glissement: niveaux[m.glissement], risque_erosion: niveaux[m.erosion],
    }));
    const sources = {};
    for (const k of VAR_KEYS) sources[k] = sourceDe(k);
    const meta = {
        application: 'TERRAPULSE - Kivu EarthLab',
        exporte_le: new Date().toISOString().slice(0, 10),
        langue: LANG,
        zone: t('export.zone'),
        periode: [R.debut, R.fin], pas_de_temps: R.gran,
        sources,
        seuils: { pluie_mm_par_mois: R.seuils.pluie, humidite_pourcent: R.seuils.hum, ndvi: R.seuils.ndvi },
        previsions: t('export.model'),
    };
    return { meta, observations, previsions };
}

function telecharger(nom, contenu, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([contenu], { type }));
    a.download = nom;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function exporterCsv() {
    if (!state.dernier) return;
    const E = construireExport(), M = E.meta;
    const cols = ['type', 'periode', 'precipitation_mm', 'precipitation_bas', 'precipitation_haut',
        'humidite_sol_pourcent', 'humidite_bas', 'humidite_haut', 'ndvi', 'ndvi_bas', 'ndvi_haut',
        'proba_pluie_sup_seuil', 'proba_humidite_sup_seuil', 'proba_ndvi_inf_seuil', 'risque_glissement', 'risque_erosion'];
    const L0 = [
        `# ${M.application} - ${t('export.head', { d: M.exporte_le })}`,
        '# ' + t('export.line2', { zone: M.zone, a: M.periode[0], b: M.periode[1], g: t('gran.' + M.pas_de_temps) }),
        ...VAR_KEYS.map(k => '# ' + t('export.source', { v: t('var.' + k), s: M.sources[k] })),
        '# ' + t('export.thr', { p: M.seuils.pluie_mm_par_mois, h: M.seuils.humidite_pourcent, n: M.seuils.ndvi }),
        '# ' + t('export.fc', { t: M.previsions }),
        cols.join(','),
    ];
    const ligne = (type, o) => cols.map(c => c === 'type' ? type : (o[c] ?? '')).join(',');
    E.observations.forEach(o => L0.push(ligne('observation', o)));
    E.previsions.forEach(o => L0.push(ligne('prevision', o)));
    telecharger(`terrapulse_bukavu_${M.pas_de_temps}_${M.periode[0]}_${M.periode[1]}.csv`,
        '﻿' + L0.join('\r\n') + '\r\n', 'text/csv;charset=utf-8');
}

function exporterJson() {
    if (!state.dernier) return;
    const E = construireExport();
    telecharger(`terrapulse_bukavu_${E.meta.pas_de_temps}_${E.meta.periode[0]}_${E.meta.periode[1]}.json`,
        JSON.stringify(E, null, 2), 'application/json');
}

/* =====================================================================
 * 11. Langue et démarrage
 * ===================================================================== */
function changerLangue(l) {
    if (!I18N[l]) return;
    LANG = l;
    try { localStorage.setItem('terrapulse-lang', l); } catch (e) { /* stockage indisponible */ }
    appliquerTextes();
    rendre();
    afficherTextesCarte();
}

function demarrer() {
    LANG = langueInitiale();
    for (const id of ['startDate', 'endDate', 'granularity', 'forecastMonths', 'thrRain', 'thrHum', 'thrNdvi'])
        $(id).addEventListener('change', rendre);
    document.querySelectorAll('.tp-lang').forEach(b => b.addEventListener('click', () => changerLangue(b.dataset.lang)));
    $('btnCsv').addEventListener('click', exporterCsv);
    $('btnJson').addEventListener('click', exporterJson);
    $('csvFileInput').addEventListener('change', e => {
        const f = e.target.files[0];
        if (!f) return;
        const lecteur = new FileReader();
        lecteur.onload = ev => {
            const n = chargerCsvMensuel(ev.target.result, f.name);
            const statut = $('csvStatus');
            statut.dataset.etat = '1';      // message figé : il ne sera plus remplacé par l'aide par défaut
            statut.textContent = n ? t('csv.ok', { n, f: f.name }) : t('csv.bad');
            if (n) { initialiserFiltres(); appliquerTextes(); rendre(); }
        };
        lecteur.readAsText(f, 'UTF-8');
    });

    if (chargerDonneesNasa()) initialiserFiltres();
    appliquerTextes();
    rendre();
    initialiserCarte();
}

if (typeof document !== 'undefined') window.addEventListener('DOMContentLoaded', demarrer);
</script>
