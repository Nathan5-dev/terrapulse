<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraPulse - Environmental Intelligence Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="terrapulse_data.js"></script>
    <style>
        :root { color-scheme: dark; --page: #0f172a; --card: #1e293b; --raised: #334155; --line: #334155;
                --text: #f1f5f9; --muted: #94a3b8; --soft: #cbd5e1; --input: #0f172a; }
        :root[data-theme="light"] { color-scheme: light; --page: #f1f5f9; --card: #fff; --raised: #e2e8f0; --line: #cbd5e1;
                --text: #0f172a; --muted: #475569; --soft: #334155; --input: #fff; }
        body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--page); color: var(--text); }
        .tp-card { background: var(--card); border-color: var(--line); }
        .tp-input { background: var(--input); color: var(--text); border-color: var(--line); }
        :root[data-theme="light"] .bg-slate-900 { background-color: #fff !important; }
        :root[data-theme="light"] .bg-slate-800 { background-color: #e2e8f0 !important; }
        :root[data-theme="light"] .bg-slate-700 { background-color: #cbd5e1 !important; }
        :root[data-theme="light"] .bg-slate-950 { background-color: #f8fafc !important; }
        :root[data-theme="light"] .border-slate-700,
        :root[data-theme="light"] .border-slate-600 { border-color: #cbd5e1 !important; }
        :root[data-theme="light"] .text-white,
        :root[data-theme="light"] .text-slate-100,
        :root[data-theme="light"] .text-slate-200 { color: #0f172a !important; }
        :root[data-theme="light"] .text-slate-300 { color: #334155 !important; }
        :root[data-theme="light"] .text-slate-400 { color: #475569 !important; }
        :root[data-theme="light"] .file\:bg-slate-700 { background-color: #cbd5e1 !important; }
        :root[data-theme="light"] .file\:text-slate-100 { color: #0f172a !important; }
        :root[data-theme="light"] .tp-pill { color: #334155; border-color: #94a3b8; }
        :root[data-theme="light"] .tp-pill[aria-pressed="true"] { color: #fff; background: #059669; border-color: #059669; }
        :root[data-theme="light"] #carte { background: #e2e8f0; }
        .tp-model-equation { color: #047857; }
        .tp-input { width: 100%; background: var(--input); border: 1px solid var(--line); border-radius: 0.75rem;
                    padding: 0.5rem 0.75rem; font-size: 0.875rem; color: var(--text); }
        .tp-input:focus { outline: none; border-color: #10b981; }
        .tp-label { display: block; font-size: 0.75rem; font-weight: 500; color: var(--soft); margin-bottom: 0.25rem; }
        .tp-card { background: var(--card); border: 1px solid var(--line); border-radius: 1rem; padding: 1.25rem; }
        .tp-table th, .tp-table td { padding: 0.375rem 0.5rem; text-align: right; white-space: nowrap; }
        .tp-table thead th { white-space: normal; vertical-align: bottom; }
        .tp-table th:first-child, .tp-table td:first-child { text-align: left; }
        .tp-table thead th { color: #94a3b8; font-weight: 600; border-bottom: 1px solid #334155; }
        .tp-table tbody tr + tr td { border-top: 1px solid #293548; }
        .tp-table { font-variant-numeric: tabular-nums; }
        .tp-swatch { display: inline-block; width: 0.75rem; height: 0.75rem; border-radius: 3px; margin-right: 0.5rem; }
        #carte { height: 36rem; border-radius: 0.75rem; background: #0f172a; z-index: 0; }
        .tp-commune { background: rgba(15, 23, 42, 0.85); color: #f1f5f9; border: 0; box-shadow: none;
                      font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 999px; }
        .tp-commune::before { display: none; }
        .tp-pill { cursor: pointer; padding: 0.375rem 0.875rem; border-radius: 999px; font-size: 0.8125rem;
                   font-weight: 600; color: #cbd5e1; border: 1px solid #475569; background: transparent; }
        .tp-pill[aria-pressed="true"] { background: #e2e8f0; color: #0f172a; border-color: #e2e8f0; }
        .tp-map-icon-button { width: 2.75rem; height: 2.75rem; display: inline-flex; align-items: center; justify-content: center;
                             border: 1px solid rgba(255,255,255,.28); border-radius: .75rem; color: #fff;
                             background: rgba(15,23,42,.88); box-shadow: 0 4px 12px rgba(0,0,0,.28);
                             transition: background-color .15s, transform .15s; }
        .tp-map-icon-button:hover { background: #334155; transform: translateY(-1px); }
        .tp-map-icon-button[aria-pressed="true"] { background: #059669; border-color: #34d399; color: #fff; }
        .tp-map-icon-button:focus-visible { outline: 2px solid #6ee7b7; outline-offset: 2px; }
    </style>
</head>
    <body class="min-h-full flex flex-col">

    <header class="tp-theme-surface border-b border-slate-700 px-4 md:px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-3">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-500 text-slate-950 p-2.5 rounded-xl flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide text-white">TERRAPULSE</h1>
                <p class="text-xs text-emerald-400 font-medium">Kivu EarthLab — Listen to Earth. Understand Change. Predict Tomorrow.</p>
            </div>
        </div>
        <div class="flex flex-wrap items-center justify-center gap-2 text-xs">
            <span class="px-3 py-1 bg-slate-700 text-slate-200 rounded-full border border-slate-600 font-medium" data-i18n="header.zone"></span>
            <span id="sourceBadge" class="px-3 py-1 bg-emerald-950 text-emerald-300 rounded-full border border-emerald-800 font-semibold"></span>
            <span class="flex gap-1 ml-1" role="group" aria-label="Langue / Language">
                <button class="tp-pill tp-lang" data-lang="fr" aria-pressed="true" title="Français">FR</button>
                <button class="tp-pill tp-lang" data-lang="en" aria-pressed="false" title="English">EN</button>
            </span>
            <button id="btnTheme" class="tp-pill" type="button" aria-pressed="false" data-i18n-title="theme.light" aria-label="Mode clair" title="Mode clair">
                <span id="themeIcon" aria-hidden="true">☀️</span>
                <span id="themeLabel" data-i18n="theme.light">Mode clair</span>
            </button>
        </div>
    </header>

    <main class="flex-1 p-4 md:p-6 max-w-7xl mx-auto w-full space-y-6">

        <!-- Filtres : une seule ligne, au-dessus de tout ce qu'ils pilotent -->
        <section class="tp-card grid grid-cols-2 md:grid-cols-4 gap-4 items-end">
            <div>
                <label class="tp-label" for="startDate" data-i18n="filter.start"></label>
                <input type="date" id="startDate" class="tp-input">
            </div>
            <div>
                <label class="tp-label" for="endDate" data-i18n="filter.end"></label>
                <input type="date" id="endDate" class="tp-input">
            </div>
            <div>
                <label class="tp-label" for="granularity" data-i18n="filter.step"></label>
                <select id="granularity" class="tp-input">
                    <option value="day" data-i18n="filter.step.day"></option>
                    <option value="week" data-i18n="filter.step.week"></option>
                    <option value="month" data-i18n="filter.step.month" selected></option>
                    <option value="year" data-i18n="filter.step.year"></option>
                </select>
            </div>
            <div>
                <label class="tp-label" for="forecastMonths" data-i18n="filter.horizon"></label>
                <select id="forecastMonths" class="tp-input">
                    <option value="3" data-i18n="filter.h3"></option>
                    <option value="6" data-i18n="filter.h6" selected></option>
                    <option value="12" data-i18n="filter.h12"></option>
                </select>
            </div>
            <p id="filterNote" class="col-span-2 md:col-span-4 text-xs text-slate-400 -mt-1"></p>
        </section>

        <div id="noData" class="hidden tp-card text-sm text-amber-200" data-i18n="nodata"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- Colonne gauche : diagnostic, seuils, export, sources -->
            <div class="space-y-6">
                <section class="tp-card">
                    <h2 class="text-lg font-semibold text-white mb-1" data-i18n="diag.title"></h2>
                    <p id="diagIntro" class="text-xs text-slate-400 mb-4"></p>
                    <div id="diagBody" class="space-y-3"></div>
                    <p class="text-[11px] text-slate-400 mt-4 leading-relaxed" data-i18n="diag.disclaimer"></p>
                </section>

                <section class="tp-card">
                    <h2 class="text-base font-semibold text-white mb-3" data-i18n="thr.title"></h2>
                    <div class="space-y-3">
                        <div>
                            <label class="tp-label" for="thrRain" data-i18n="thr.rain"></label>
                            <input type="number" id="thrRain" class="tp-input" step="5" min="0" value="150">
                        </div>
                        <div>
                            <label class="tp-label" for="thrHum" data-i18n="thr.hum"></label>
                            <input type="number" id="thrHum" class="tp-input" step="0.5" min="0" max="100">
                        </div>
                        <div>
                            <label class="tp-label" for="thrNdvi" data-i18n="thr.ndvi"></label>
                            <input type="number" id="thrNdvi" class="tp-input" step="0.01" min="-1" max="1" value="0.40">
                        </div>
                    </div>
                    <p id="thrNote" class="text-[11px] text-slate-400 mt-3 leading-relaxed"></p>
                </section>

                <section class="tp-card">
                    <h2 class="text-base font-semibold text-white mb-1" data-i18n="export.title"></h2>
                    <p class="text-xs text-slate-400 mb-3" data-i18n="export.desc"></p>
                    <div class="grid grid-cols-2 gap-3">
                        <button id="btnCsv" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-3 rounded-xl text-sm" data-i18n="export.csv"></button>
                        <button id="btnJson" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2 px-3 rounded-xl text-sm border border-slate-600" data-i18n="export.json"></button>
                        <button id="btnPdf" class="col-span-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-3 rounded-xl text-sm" data-i18n="export.pdf"></button>
                    </div>
                </section>

                <section class="tp-card">
                    <h2 class="text-base font-semibold text-white mb-3" data-i18n="src.title"></h2>
                    <ul id="sourcesList" class="space-y-2 text-xs text-slate-300 leading-relaxed"></ul>
                    <div class="mt-4 pt-4 border-t border-slate-700">
                        <label class="tp-label" for="csvFileInput" data-i18n="csv.label"></label>
                        <input type="file" id="csvFileInput" accept=".csv" class="block w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-slate-100 hover:file:bg-slate-600 cursor-pointer">
                        <p id="csvStatus" class="text-[11px] text-slate-400 mt-1"></p>
                    </div>
                </section>
            </div>

            <!-- Colonne droite : un graphique par variable, chacun avec son interprétation -->
            <div class="lg:col-span-2 space-y-6">
                <section class="tp-card">
                    <h2 class="text-lg font-semibold text-white" data-i18n="chart.precipitation"></h2>
                    <p id="subRain" class="text-xs text-slate-400 mb-3"></p>
                    <div class="relative h-60 w-full"><canvas id="chartRain"></canvas></div>
                    <div id="interpRain" class="mt-4 pt-4 border-t border-slate-700 text-xs text-slate-300 space-y-2 leading-relaxed"></div>
                </section>
                <section class="tp-card">
                    <h2 class="text-lg font-semibold text-white" data-i18n="chart.humidity"></h2>
                    <p id="subHum" class="text-xs text-slate-400 mb-3"></p>
                    <div class="relative h-60 w-full"><canvas id="chartHum"></canvas></div>
                    <div id="interpHum" class="mt-4 pt-4 border-t border-slate-700 text-xs text-slate-300 space-y-2 leading-relaxed"></div>
                </section>
                <section class="tp-card">
                    <h2 class="text-lg font-semibold text-white" data-i18n="chart.ndvi"></h2>
                    <p id="subNdvi" class="text-xs text-slate-400 mb-3"></p>
                    <div class="relative h-60 w-full"><canvas id="chartNdvi"></canvas></div>
                    <div id="interpNdvi" class="mt-4 pt-4 border-t border-slate-700 text-xs text-slate-300 space-y-2 leading-relaxed"></div>
                </section>

                <details class="tp-card">
                    <summary class="cursor-pointer text-lg font-semibold text-white" data-i18n="fc.title"></summary>
                    <p id="modelNote" class="text-xs text-slate-400 mb-3"></p>
                    <div id="modelFormula" class="mb-3 rounded-xl border border-slate-700 bg-slate-900 p-3 text-slate-300 leading-relaxed"></div>
                    <div class="overflow-x-auto"><table id="forecastTable" class="tp-table w-full text-xs text-slate-200"></table></div>
                </details>

                <details class="tp-card">
                    <summary class="cursor-pointer text-sm font-semibold text-white" data-i18n="obs.summary"></summary>
                    <p id="obsTableNote" class="text-xs text-slate-400 mt-2"></p>
                    <div class="overflow-auto max-h-96 mt-2"><table id="obsTable" class="tp-table w-full text-xs text-slate-200"></table></div>
                </details>
            </div>
        </div>

        <!-- LOCATE : carte des versants vulnérables -->
        <section class="tp-card" id="sectionCarte">
            <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3 mb-3">
                <div>
                    <h2 class="text-lg font-semibold text-white" data-i18n="map.title"></h2>
                    <p id="carteSousTitre" class="text-xs text-slate-400"></p>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <div class="flex flex-wrap gap-2" role="group" aria-label="Couche affichée / Displayed layer">
                        <button class="tp-pill tp-couche" data-couche="indice" aria-pressed="true" data-i18n="map.btn.indice"></button>
                        <button class="tp-pill tp-couche" data-couche="pente" aria-pressed="false" data-i18n="map.btn.pente"></button>
                        <button class="tp-pill tp-couche" data-couche="ndvi" aria-pressed="false" data-i18n="map.btn.ndvi"></button>
                    </div>
                </div>
            </div>
            <p id="carteSaison" class="text-sm text-slate-200 mb-3"></p>
            <div class="relative">
                <div id="carte"></div>
                <div class="absolute top-3 right-3 z-[500] flex flex-col gap-2" role="group" aria-label="Fond de carte / Basemap">
                    <button class="tp-map-icon-button tp-fond" data-fond="plan" aria-pressed="true" data-i18n-title="map.fond.plan" aria-label="Plan" title="Plan">
                        <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15m6-12v15"/>
                        </svg>
                    </button>
                    <button class="tp-map-icon-button tp-fond" data-fond="satellite" aria-pressed="false" data-i18n-title="map.fond.satellite" aria-label="Satellite" title="Satellite">
                        <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="6" height="6" rx="1.2" transform="rotate(-45 12 12)"/>
                            <path d="m10 10-4-4-3 3 4 4m7-7 4-4 3 3-4 4M8 8l3-3m5 11 3 3m-6-2v4m-2-1h4"/>
                            <path d="M5 5a5 5 0 0 1 0 7l-3-3 3-4Z"/>
                            <path d="m5 12 3 3m-3-3-2 2"/>
                            <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
                        </svg>
                    </button>
                    <button id="btnMaPosition" class="tp-map-icon-button" type="button" data-i18n-title="map.location" aria-label="Ma position" title="Ma position">
                        <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.5"/>
                            <path d="M12 2v3m0 14v3M2 12h3m14 0h3"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div id="carteLegende" class="flex flex-wrap items-center gap-x-4 gap-y-1 mt-3 text-xs text-slate-300"></div>
            <p id="carteNote" class="text-[11px] text-slate-400 mt-2 leading-relaxed"></p>

            <h3 id="communesTitre" class="text-base font-semibold text-white mt-5 mb-2" data-i18n="map.communes"></h3>
            <div class="overflow-x-auto"><table id="communesTable" class="tp-table w-full text-xs text-slate-200"></table></div>
            <ul id="carteSources" class="mt-4 pt-4 border-t border-slate-700 space-y-1 text-[11px] text-slate-400 leading-relaxed"></ul>
        </section>
    </main>

    <footer id="footer" class="tp-theme-surface border-t border-slate-700 text-center py-3 px-4 text-xs text-slate-400"></footer>

<!-- Application découpée en couches : Domain/Core, Data, Presentation -->
<script src="src/core/config.js"></script>
<script src="src/core/dates.js"></script>
<script src="src/core/stats.js"></script>
<script src="src/core/aggregate.js"></script>
<script src="src/core/forecast.js"></script>
<script src="src/core/analyze.js"></script>
<script src="src/core/dataset.js"></script>
<script src="src/core/dashboard.js"></script>
<script src="src/core/mapLayers.js"></script>
<script src="src/core/report.js"></script>
<script src="src/data/nasaDatasetRepository.js"></script>
<script src="src/data/csvDatasetRepository.js"></script>
<script src="src/data/exportSerializer.js"></script>
<script src="src/presentation/i18n/fr.js"></script>
<script src="src/presentation/i18n/en.js"></script>
<script src="src/presentation/i18n/index.js"></script>
<script src="src/presentation/dom.js"></script>
<script src="src/presentation/format.js"></script>
<script src="src/presentation/theme.js"></script>
<script src="src/presentation/badges.js"></script>
<script src="src/presentation/chartsView.js"></script>
<script src="src/presentation/interpretationView.js"></script>
<script src="src/presentation/diagnosticView.js"></script>
<script src="src/presentation/tablesView.js"></script>
<script src="src/presentation/filtersView.js"></script>
<script src="src/presentation/sourcesView.js"></script>
<script src="src/presentation/exportView.js"></script>
<script src="src/presentation/map/basemap.js"></script>
<script src="src/presentation/map/mapView.js"></script>
<script src="src/presentation/map/mapPanels.js"></script>
<script src="src/presentation/appController.js"></script>
<script src="src/main.js"></script>
</body>
</html>
